# HAVEN multi-node Renode ring configuration
#
# Sourced by start_haven.sh (shell syntax) and read by bridge/ring_switch.py
# (KEY=VALUE syntax), so keep it to plain assignments with no expansion.
#
#   ./start_haven.sh              # run the ring
#   ./start_haven.sh --config my.conf

# ---------------------------------------------------------------------------
# Number of nodes in the ring
# ---------------------------------------------------------------------------
# Constraints:
#   * 3 <= NUM_NODES <= 10. Below 3 there is no ring: with 2 nodes each is the
#     other's only neighbour, tx_election() forwards to nobody, and ECHO_THRESHOLD
#     is never met, so no leader is ever elected.
#   * <= 10 because firmware/src/provision.c provisions battery and spaces for
#     ids 1..10 only (HAVEN_PROV_NUM_NODES).
#   * At m=12/k=5 ~99% of pairs share a space, so the id-ordered ring works
#     for every N from 3 to 10 and you can wire nodes simply as 1-2-...-N-1.
#     See HAVEN_M_SPACES in firmware/include/haven_config.h. At the older
#     m=50 only ~42% of pairs could link, which made id order impossible and
#     left RING_ORDER below load-bearing.
NUM_NODES=3

# ---------------------------------------------------------------------------
# Ring order
# ---------------------------------------------------------------------------
# The physical wiring order: RING_ORDER[i] is cabled to RING_ORDER[i-1] and
# RING_ORDER[i+1], wrapping around. Only the first NUM_NODES entries are used.
#
# With the shipped m=12/k=5 this may simply be 1..N, and the launcher defaults
# to that. The explicit list exists so you can test an arbitrary topology (e.g.
# "2 1 3" to wire a different shape) or override it if you retune m. If you
# change HAVEN_M_SPACES and id order stops working, recompute a valid cycle:
#
#     ./sim/compute_ring_order.py --nodes $NUM_NODES --m 12 --k 5
#
# Any two entries listed as neighbours MUST share a space, or they can never
# form a link (compute_K_AB returns None). start_haven.sh validates this before
# launching and refuses to start on an invalid order.
RING_ORDER="1 9 5 2 4 7 6 8 3 10"

# ---------------------------------------------------------------------------
# Radio channel parameters
# ---------------------------------------------------------------------------
# Per-hop propagation delay in milliseconds, applied by the ring switch to each
# relayed frame. Models radio air time; Renode itself runs the CPU in real time.
# Set to 0 for a zero-delay (virtual) channel.
HOP_DELAY_MS=20

# ---------------------------------------------------------------------------
# Timeouts (milliseconds of emulated time)
# ---------------------------------------------------------------------------
# The switch exits with a non-zero status if no leader heartbeat is observed
# within this window.
#
# Keep this comfortably above the firmware's own timers, which are in
# EMULATED milliseconds, plus Renode's ~2-3s boot. Measured on this machine:
# firmware time_ms() advances at only ~0.56x wall time, because it polls the
# SysTick COUNTFLAG and misses roughly every other tick. So the firmware's
# 5000ms discovery window really takes ~9s of wall clock, and reaching a leader
# takes ~27s:
#     RUN_SECONDS  ~=  (HAVEN_T_CLAIM_MS + 2 * HAVEN_T_WINDOW_MS) / 0.56  +  10
# 90s leaves ample margin. Setting this to 25 or 30 will fail with "no leader",
# and that is a timeout, not a protocol fault.
RUN_SECONDS=90

# ---------------------------------------------------------------------------
# Renode
# ---------------------------------------------------------------------------
# Renode executable. Overridden automatically if not on PATH.
RENODE_BIN=renode

# Extra flags for each Renode instance.
#   --disable-xwt  run headless; N GUI windows would each need their own display,
#                  and the PTY is the only data path the ring needs.
#   --port -1      disable the monitor socket AND GUI. Required for N>1: every
#                  instance otherwise tries to bind 0.0.0.0:1234 and all but the
#                  first die with "AddressAlreadyInUse" before creating a PTY.
RENODE_FLAGS="--disable-xwt --hide-log --port -1"

# Seconds to wait for a node's PTY symlink to appear before giving up.
PTY_TIMEOUT_S=30